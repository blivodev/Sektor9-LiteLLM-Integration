router_settings:
  routing_strategy: "cost-based-routing"
  num_retries: 2
  timeout: 180
  fallbacks:
    - { "sektor9-code": ["sektor9-code-fallback-1", "sektor9-code-fallback-2"] }
    - { "sektor9-ask": ["sektor9-ask-fallback-1", "sektor9-ask-fallback-2"] }
    - { "sektor9-debug": ["sektor9-debug-fallback-1", "sektor9-debug-fallback-2"] }
    - { "sektor9-plan": ["sektor9-plan-fallback-1", "sektor9-plan-fallback-2"] }
    - { "sektor9-orchestrator": ["sektor9-orchestrator-fallback-1", "sektor9-orchestrator-fallback-2"] }
    - { "sektor9-review": ["sektor9-review-fallback-1"] }
    - { "sektor9-refactor": ["sektor9-refactor-fallback-1"] }
    - { "sektor9-test": ["sektor9-test-fallback-1"] }
    - { "sektor9-docs": ["sektor9-docs-fallback-1"] }
    - { "sektor9-sql": ["sektor9-sql-fallback-1"] }
    - { "sektor9-devops": ["sektor9-devops-fallback-1"] }
    - { "sektor9-creative": ["sektor9-creative-fallback-1"] }
    # Kilo fallbacks
    - { "kilo-code": ["kilo-code-fallback-1", "kilo-code-fallback-2"] }
    - { "kilo-ask": ["kilo-ask-fallback-1", "kilo-ask-fallback-2"] }
    - { "kilo-debug": ["kilo-debug-fallback-1", "kilo-debug-fallback-2"] }
    - { "kilo-plan": ["kilo-plan-fallback-1", "kilo-plan-fallback-2"] }
    - { "kilo-orchestrator": ["kilo-orchestrator-fallback-1", "kilo-orchestrator-fallback-2"] }

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# ═══════════════════════════════════════════════════════════════════════════
# ── MCP Gateway Servers ───────────────────────────────────────────────────
# ═══════════════════════════════════════════════════════════════════════════
mcp_servers:
  filesystem:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
  sequential_thinking:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
  memory:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: /data/memory.json
  fetch:
    transport: stdio
    command: uvx
    args: ["mcp-server-fetch"]
  playwright:
    transport: stdio
    command: npx
    args: ["-y", "@playwright/mcp@latest"]
  openstreetmap:
    transport: stdio
    command: uvx
    args: ["--with", "mcp<2", "osm-mcp-server"]
  dbhub:
    transport: stdio
    command: npx
    args: ["-y", "@bytebase/dbhub@latest", "--transport", "stdio"]
    env:
      DSN: os.environ/MCP_POSTGRES_DSN
  postgres_pro:
    transport: stdio
    command: uvx
    args: ["--with", "mcp<2", "postgres-mcp", "--access-mode=unrestricted"]
    env:
      DATABASE_URI: os.environ/MCP_POSTGRES_DSN
  language_server_go:
    transport: stdio
    command: npx
    args: ["-y", "/opt/npx-shim", "/opt/go/bin/mcp-language-server", "-workspace", "/workspace", "-lsp", "gopls"]
    timeout: 30
  video_audio:
    transport: stdio
    command: npx
    args: ["-y", "/opt/npx-shim", "uv", "run", "--directory", "/opt/video-audio-mcp", "server.py"]
    timeout: 30
  ssh:
    transport: stdio
    command: npx
    args: ["-y", "@idletoaster/ssh-mcp-server"]
    env:
      SSH_HOST: os.environ/SSH_HOST
      SSH_PORT: os.environ/SSH_PORT
      SSH_USERNAME: os.environ/SSH_USERNAME
      SSH_PASSWORD: os.environ/SSH_PASSWORD
  meshy_3d:
    transport: stdio
    command: npx
    args: ["-y", "@meshy-ai/meshy-mcp-server"]
    env:
      MESHY_API_KEY: os.environ/MESHY_API_KEY
  tripo_3d:
    transport: stdio
    command: npx
    args: ["-y", "tripo-ai-mcp-server"]
    env:
      TRIPO_API_SECRET: os.environ/TRIPO_API_SECRET
  elevenlabs:
    transport: stdio
    command: uvx
    args: ["elevenlabs-mcp"]
    env:
      ELEVENLABS_API_KEY: os.environ/ELEVENLABS_API_KEY
  suno_music:
    transport: stdio
    command: uvx
    args: ["mcp-suno"]
    env:
      ACEDATACLOUD_API_TOKEN: os.environ/ACEDATACLOUD_API_TOKEN
  blender:
    transport: stdio
    command: uvx
    args: ["blender-mcp"]
    env:
      BLENDER_HOST: host.docker.internal
      BLENDER_PORT: "9876"
