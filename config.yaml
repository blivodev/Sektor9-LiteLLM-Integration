  # same price, Fireworks same price. All three are the same model family.
  # ═══════════════════════════════════════════════════════════════════════════
  - model_name: sektor9-code
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash
      api_key: os.environ/DEEPINFRA_API_KEY
