# ── Sektor9 LiteLLM Integration Configuration ──────────────────────────────
# Master gateway configuration for LLM models, autoRouter, and MCP tools.

model_list:
  # ═══════════════════════════════════════════════════════════════════════════
  # ── Sektor9 Primary Agent Modes ───────────────────────────────────────────
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Mode: Sektor9 Code (Primary implementation model, highest call volume)
  - model_name: sektor9-code
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4-Flash-0731
      api_key: os.environ/DEEPINFRA_API_KEY
