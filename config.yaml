router_settings:
  # cost-based-routing: picks the CHEAPEST healthy deployment for each model.
  # For same-model multi-provider deployments this routes to the lowest-priced
  # provider first, with automatic failover to the next-cheapest. OpenRouter is
  # never the primary when a cheaper direct provider hosts the same model.
  routing_strategy: "cost-based-routing"
  num_retries: 2
  timeout: 180
  # ── Cooldown / failover tuning (why these are not defaults) ──────────────
  # LiteLLM's defaults are cooldown_time=5s and allowed_fails=3. Five seconds
  # means a credit-dead provider rejoins rotation almost immediately and gets
  # hammered again -> failover looks "inconsistent". 300s keeps a provider that
  # just said "out of credits / over budget" out of rotation long enough for
  # the next-cheapest healthy provider to serve, without a restart.
  cooldown_time: 300
  # One failure (with the account-level patch mapping it to RateLimitError) is
  # enough to cool a deployment down -- don't require 3 hits before skipping a
  # provider that is provably out of credits.
  allowed_fails: 1
  fallbacks:
    # Every chain here is LOOP-SAFE and has NO DEAD END. Two rules:
    #   (a) a primary group falls to its cheaper/alternate *-fallback-N groups;
    #   (b) each *-fallback-N group falls BACK to its own primary group, whose
    #       multi-provider deployment list still holds a healthy leg.
    # Without rule (b), a request pinned to a single-provider fallback group
    # (e.g. sektor9-review-fallback-1 = Fireworks only) died hard the moment
    # that one provider ran out of credits -- the "Fireworks ran out and
    # nothing fell back" incident. With (b) the router keeps re-trying the
    # primary group, and deployment cooldown skips the dead provider, so it
    # lands on a live one instead of erroring.
    #
    # AutoRouter aliases first: if every same-model deployment fails, step
    # down to sektor9-code (the highest-volume, best-covered group).
    - { "sektor9-autorouter": ["sektor9-code", "sektor9-code-fallback-1", "sektor9-code-fallback-2"] }
    - { "autorouter": ["sektor9-code", "sektor9-code-fallback-1", "sektor9-code-fallback-2"] }
    - { "auto-router": ["sektor9-code", "sektor9-code-fallback-1", "sektor9-code-fallback-2"] }
    - { "sektor9-code": ["sektor9-code-fallback-1", "sektor9-code-fallback-2"] }
    - { "sektor9-code-fallback-1": ["sektor9-code"] }
    - { "sektor9-code-fallback-2": ["sektor9-code"] }
    - { "sektor9-ask": ["sektor9-ask-fallback-1", "sektor9-ask-fallback-2"] }
    - { "sektor9-ask-fallback-1": ["sektor9-ask"] }
    - { "sektor9-ask-fallback-2": ["sektor9-ask"] }
    - { "sektor9-debug": ["sektor9-debug-fallback-1", "sektor9-debug-fallback-2"] }
    - { "sektor9-debug-fallback-1": ["sektor9-debug"] }
    - { "sektor9-debug-fallback-2": ["sektor9-debug"] }
    - { "sektor9-plan": ["sektor9-plan-fallback-1", "sektor9-plan-fallback-2"] }
    - { "sektor9-plan-fallback-1": ["sektor9-plan"] }
    - { "sektor9-plan-fallback-2": ["sektor9-plan"] }
    - { "sektor9-orchestrator": ["sektor9-orchestrator-fallback-1", "sektor9-orchestrator-fallback-2"] }
    - { "sektor9-orchestrator-fallback-1": ["sektor9-orchestrator"] }
    - { "sektor9-orchestrator-fallback-2": ["sektor9-orchestrator"] }
    - { "sektor9-review": ["sektor9-review-fallback-1"] }
    - { "sektor9-review-fallback-1": ["sektor9-review"] }
    - { "sektor9-refactor": ["sektor9-refactor-fallback-1"] }
    - { "sektor9-refactor-fallback-1": ["sektor9-refactor"] }
    - { "sektor9-test": ["sektor9-test-fallback-1"] }
    - { "sektor9-test-fallback-1": ["sektor9-test"] }
    - { "sektor9-docs": ["sektor9-docs-fallback-1"] }
    - { "sektor9-docs-fallback-1": ["sektor9-docs"] }
    - { "sektor9-sql": ["sektor9-sql-fallback-1"] }
    - { "sektor9-sql-fallback-1": ["sektor9-sql"] }
    - { "sektor9-devops": ["sektor9-devops-fallback-1"] }
    - { "sektor9-devops-fallback-1": ["sektor9-devops"] }
    - { "sektor9-creative": ["sektor9-creative-fallback-1"] }
