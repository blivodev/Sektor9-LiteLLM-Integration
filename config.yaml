# ── Sektor9 LiteLLM Integration Configuration ──────────────────────────────
# Master gateway configuration for LLM models, autoRouter, and MCP tools.
#
# Routing philosophy:
#   routing_strategy = cost-based-routing
#   For each model_name, multiple deployments of the SAME underlying model are
#   listed across providers with explicit input/output cost per token. LiteLLM
#   picks the CHEAPEST healthy deployment automatically, and fails over to the
#   next-cheapest when one provider errors. OpenRouter is deliberately priced
#   at the reseller markup (or tied) so it is the LAST resort, not the primary,
#   except where it is genuinely the cheapest (tie broken by health).
#   Every chain still spans different providers so no single one is a SPOF.

