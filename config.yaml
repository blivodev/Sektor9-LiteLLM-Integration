general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

mcp_servers:
  filesystem:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
  sequential_thinking:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
  memory:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: /data/memory.json
  fetch:
    transport: stdio
    command: uvx
    args: ["mcp-server-fetch"]
  playwright:
    transport: stdio
    command: npx
    args: ["-y", "@playwright/mcp@latest"]
  openstreetmap:
    transport: stdio
    command: uvx
    args: ["--with", "mcp<2", "osm-mcp-server"]
  dbhub:
    transport: stdio
    command: npx
    args: ["-y", "@bytebase/dbhub@latest", "--transport", "stdio"]
    env:
      DSN: os.environ/MCP_POSTGRES_DSN
  postgres_pro:
    transport: stdio
    command: uvx
    args: ["--with", "mcp<2", "postgres-mcp", "--access-mode=unrestricted"]
    env:
      DATABASE_URI: os.environ/MCP_POSTGRES_DSN
  language_server_go:
    transport: stdio
    command: npx
